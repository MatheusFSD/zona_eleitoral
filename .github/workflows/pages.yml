# Publica o jogo no GitHub Pages a cada push na main.
#
# Uma vez só, no repositório: Settings › Pages › Build and deployment ›
# Source: "GitHub Actions". Sem isso o fluxo roda mas não tem onde publicar.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # para publicar à mão pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar outra, a anterior é cancelada.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # O dist inteiro vira o site. O base "./" do vite.config.js é o que
      # faz o jogo funcionar em /zona_eleitoral/ sem saber o nome do repo.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
